[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "shotbox-assets"
version = "0.1.0"
description = "A lightweight PyQt6 browser for VFX assets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = ["PyQt6>=6.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
shotbox-assets = "universal_asset_library.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/universal_asset_library", "src/shotbox_assets"]

[tool.hatch.build.targets.wheel.force-include]
"templates/hdri_preview.blend" = "universal_asset_library/previews/templates/hdri_preview.blend"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
